name: ProjectMind AI CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Build and Test Backend
      run: |
        cd backend
        mvn clean verify

  frontend-ci:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: |
        cd frontend
        npm ci

    - name: Run ESLint Checks
      run: |
        cd frontend
        npm run lint --if-present

    - name: Run Vitest Unit Tests
      run: |
        cd frontend
        npm run test

    - name: Compile Production Bundle
      run: |
        cd frontend
        npm run build

  docker-publish:
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and Publish Gateway Image
      run: |
        docker build -t ghcr.io/${{ github.repository }}/api-gateway:${{ github.sha }} -t ghcr.io/${{ github.repository }}/api-gateway:latest -f backend/api-gateway/Dockerfile backend/
        docker push ghcr.io/${{ github.repository }}/api-gateway:latest

    - name: Build and Publish Auth Image
      run: |
        docker build -t ghcr.io/${{ github.repository }}/auth-service:${{ github.sha }} -t ghcr.io/${{ github.repository }}/auth-service:latest -f backend/auth-service/Dockerfile backend/
        docker push ghcr.io/${{ github.repository }}/auth-service:latest
