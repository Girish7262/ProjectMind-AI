apiVersion: v1
kind: Namespace
metadata:
  name: acciobuild
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: accio-project-config
  namespace: acciobuild
data:
  SPRING_PROFILES_ACTIVE: "prod"
  DB_URL: "jdbc:postgresql://postgres-service:5432/accio_project"
  REDIS_HOST: "redis-service"
  AUTH_SERVICE_URL: "http://accio-auth-service:8081"
  ORGANIZATION_SERVICE_URL: "http://accio-organization-service:8082"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: accio-project-service
  namespace: acciobuild
  labels:
    app: accio-project-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: accio-project-service
  template:
    metadata:
      labels:
        app: accio-project-service
    spec:
      containers:
      - name: project-service
        image: acciobuild/project-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8083
        env:
        - name: SPRING_DATASOURCE_URL
          valueFrom:
            configMapKeyRef:
              name: accio-project-config
              key: DB_URL
        - name: SPRING_DATA_REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: accio-project-config
              key: REDIS_HOST
        - name: APP_SERVICES_AUTH_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: accio-project-config
              key: AUTH_SERVICE_URL
        - name: APP_SERVICES_ORGANIZATION_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: accio-project-config
              key: ORGANIZATION_SERVICE_URL
        resources:
          limits:
            cpu: "1.0"
            memory: 1024Mi
          requests:
            cpu: "500m"
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8083
          initialDelaySeconds: 30
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8083
          initialDelaySeconds: 20
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: accio-project-service
  namespace: acciobuild
spec:
  type: ClusterIP
  selector:
    app: accio-project-service
  ports:
  - port: 8083
    targetPort: 8083
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: accio-project-hpa
  namespace: acciobuild
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: accio-project-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: accio-project-ingress
  namespace: acciobuild
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
  - http:
      paths:
      - path: /api/v1/projects
        pathType: Prefix
        backend:
          service:
            name: accio-project-service
            port:
              number: 8083
