version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-acciobuild}
      POSTGRES_USER: ${POSTGRES_USER:-accio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-accio_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - acciobuild-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    container_name: redis-cache
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - acciobuild-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: auth-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-acciobuild}
      DATABASE_USERNAME: ${POSTGRES_USER:-accio}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-accio_pass}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-dGhpcy1pcy1hLXNhZWZ0eS1zZWNyZXQta2V5LXdoaWNoLW11c3QtYmUtYXQtbGVhc3QtMjU2LWJpdHMtbG9uZy1mb3ItamN3dC1zaWduYXR1cmUtc2FmZXR5}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - acciobuild-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  organization-service:
    build:
      context: .
      dockerfile: organization-service/Dockerfile
    container_name: organization-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-acciobuild}
      DATABASE_USERNAME: ${POSTGRES_USER:-accio}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-accio_pass}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-dGhpcy1pcy1hLXNhZWZ0eS1zZWNyZXQta2V5LXdoaWNoLW11c3QtYmUtYXQtbGVhc3QtMjU2LWJpdHMtbG9uZy1mb3ItamN3dC1zaWduYXR1cmUtc2FmZXR5}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - acciobuild-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  project-service:
    build:
      context: .
      dockerfile: project-service/Dockerfile
    container_name: project-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-acciobuild}
      DATABASE_USERNAME: ${POSTGRES_USER:-accio}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-accio_pass}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-dGhpcy1pcy1hLXNhZWZ0eS1zZWNyZXQta2V5LXdoaWNoLW11c3QtYmUtYXQtbGVhc3QtMjU2LWJpdHMtbG9uZy1mb3ItamN3dC1zaWduYXR1cmUtc2FmZXR5}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - acciobuild-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  knowledge-service:
    build:
      context: .
      dockerfile: knowledge-service/Dockerfile
    container_name: knowledge-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-acciobuild}
      DATABASE_USERNAME: ${POSTGRES_USER:-accio}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-accio_pass}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-dGhpcy1pcy1hLXNhZWZ0eS1zZWNyZXQta2V5LXdoaWNoLW11c3QtYmUtYXQtbGVhc3QtMjU2LWJpdHMtbG9uZy1mb3ItamN3dC1zaWduYXR1cmUtc2FmZXR5}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8084:8084"
    volumes:
      - knowledge-storage:/app/storage
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - acciobuild-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    container_name: ai-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-acciobuild}
      DATABASE_USERNAME: ${POSTGRES_USER:-accio}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-accio_pass}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-dGhpcy1pcy1hLXNhZWZ0eS1zZWNyZXQta2V5LXdoaWNoLW11c3QtYmUtYXQtbGVhc3QtMjU2LWJpdHMtbG9uZy1mb3ItamN3dC1zaWduYXR1cmUtc2FmZXR5}
      OPENAI_ENABLED: ${OPENAI_ENABLED:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8085/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - acciobuild-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      organization-service:
        condition: service_healthy
      project-service:
        condition: service_healthy
      knowledge-service:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      APP_GATEWAY_JWTSECRET: ${JWT_SECRET:-dGhpcy1pcy1hLXNhZWZ0eS1zZWNyZXQta2V5LXdoaWNoLW11c3QtYmUtYXQtbGVhc3QtMjU2LWJpdHMtbG9uZy1mb3ItamN3dC1zaWduYXR1cmUtc2FmZXR5}
      APP_GATEWAY_AUTHSERVICEURI: http://auth-service:8081
      APP_GATEWAY_ORGANIZATIONSERVICEURI: http://organization-service:8082
      APP_GATEWAY_PROJECTSERVICEURI: http://project-service:8083
      APP_GATEWAY_KNOWLEDGESERVICEURI: http://knowledge-service:8084
      APP_GATEWAY_AISERVICEURI: http://ai-service:8085
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - acciobuild-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  acciobuild-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  knowledge-storage:
