apiVersion: v1
kind: Namespace
metadata:
  name: acciobuild
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: knowledge-service-config
  namespace: acciobuild
data:
  SPRING_PROFILES_ACTIVE: prod,k8s
  DB_HOST: postgres-service.acciobuild.svc.cluster.local
  DB_NAME: acciobuild_knowledge
  REDIS_HOST: redis-service.acciobuild.svc.cluster.local
  REDIS_PORT: "6379"
---
apiVersion: v1
kind: Secret
metadata:
  name: knowledge-service-secrets
  namespace: acciobuild
type: Opaque
stringData:
  DB_USER: postgres
  DB_PASSWORD: postgres_production_password
  JWT_SECRET: production_jwt_super_secret_signing_key_32_characters
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowledge-service
  namespace: acciobuild
  labels:
    app: knowledge-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: knowledge-service
  template:
    metadata:
      labels:
        app: knowledge-service
    spec:
      containers:
      - name: knowledge-service
        image: acciobuild/knowledge-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8084
          name: http
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1024Mi"
        envFrom:
        - configMapRef:
            name: knowledge-service-config
        - secretRef:
            name: knowledge-service-secrets
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8084
          failureThreshold: 20
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8084
          periodSeconds: 10
          timeoutSeconds: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8084
          periodSeconds: 10
          timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: knowledge-service
  namespace: acciobuild
  labels:
    app: knowledge-service
spec:
  type: ClusterIP
  ports:
  - port: 8084
    targetPort: 8084
    name: http
  selector:
    app: knowledge-service
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: knowledge-service-hpa
  namespace: acciobuild
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: knowledge-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: knowledge-service-pdb
  namespace: acciobuild
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: knowledge-service
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: knowledge-service-netpol
  namespace: acciobuild
spec:
  podSelector:
    matchLabels:
      app: knowledge-service
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          app: api-gateway
    ports:
    - protocol: TCP
      port: 8084
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: knowledge-service-ingress
  namespace: acciobuild
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  ingressClassName: nginx
  rules:
  - host: acciobuild.local
    http:
      paths:
      - path: /api/v1/knowledge/?(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: knowledge-service
            port:
              number: 8084
